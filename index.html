<script type="module">

import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyCx7bjvaKvc9SkLpqwG7StrK-TUwR8uVbI",
  authDomain: "projectsmoke-d43b4.firebaseapp.com",
  databaseURL: "https://projectsmoke-d43b4-default-rtdb.firebaseio.com",

const auth = getAuth(app), db = getDatabase(app);
const btn = document.getElementById('login');
const dlg = document.getElementById('dlg');
const gbtn = document.getElementById('gbtn');
let playerRef = null, signedIn = false;

btn.addEventListener('click', function () { if (!signedIn) dlg.classList.add('show'); });
document.getElementById('later').addEventListener('click', function () { dlg.classList.remove('show'); });
gbtn.addEventListener('click', function () {
  gbtn.disabled = true;
  signInWithPopup(auth, new GoogleAuthProvider())
    .then(function () { dlg.classList.remove('show'); })
    .catch(function (e) { console.warn('Sign-in failed', e); })
    .finally(function () { gbtn.disabled = false; });
});

onAuthStateChanged(auth, async function (user) {
  if (!user) { playerRef = null; signedIn = false; btn.textContent = 'Sign in to save'; return; }
  signedIn = true;
  btn.textContent = user.displayName || user.email || 'Signed in';
  playerRef = ref(db, 'players/' + user.uid);
  try {
    const snap = await get(playerRef);
    window.dgOnLoaded && window.dgOnLoaded(snap.exists() ? snap.val() : {});
  } catch (e) { console.warn('Progress load failed', e); }

<script>
var cv = document.getElementById('c'), ctx = cv.getContext('2d'), hud = document.getElementById('hud'), hint = document.getElementById('hint'), over = document.getElementById('over');
var H = 560, W = 800, k = 1;
function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  k = cv.height / H; W = cv.width / k;
}
addEventListener('resize', resize); resize();

/* ---------- terrain ---------- */
function gy(x) { if (chasmMode && x > CH_START) return 3000; return 478 + Math.sin(x * 0.0045) * 26 + Math.sin(x * 0.013 + 1.3) * 9 + Math.sin(x * 0.0011) * 18; }

/* ---------- canyon shapes (no bridge) ---------- */
var CX = 357;
var VARIANTS = [
  { half: [[105,480],[105,350],[168,302],[168,276],[214,236],[214,210],[256,174],[256,148],[297,116],[357,66]] },
  { half: [[95,480],[95,360],[150,320],[150,250],[215,205],[215,150],[300,108],[357,108]] },
  { half: [[150,480],[150,385],[200,335],[200,255],[245,205],[245,140],[300,92],[335,45],[357,12]] },
  { half: [[100,480],[100,340],[150,300],[150,210],[200,160],[250,70],[300,150],[330,172],[357,205]] },
  { full: [[90,480],[90,400],[200,332],[200,300],[330,196],[330,140],[400,60],[430,60],[430,170],[505,170],[505,300],[525,300],[525,480]] },
  { half: [[100,480],[100,335],[160,255],[205,295],[245,205],[295,245],[330,140],[357,110]] },
  { full: [[60,480],[60,420],[190,375],[320,300],[450,215],[540,140],[580,120],[580,480]] },
  { full: [[100,480],[100,330],[130,230],[160,40],[200,230],[230,300],[290,335],[345,255],[395,110],[430,60],[465,115],[495,260],[505,335],[505,480]] },
  { full: [[80,480],[80,410],[170,385],[170,335],[260,305],[260,255],[350,220],[350,175],[440,140],[440,95],[520,80],[520,480]] },
  { half: [[90,480],[90,200],[160,120],[230,110],[300,200],[357,320]] },
  { half: [[190,480],[190,300],[100,290],[60,230],[90,170],[170,140],[260,120],[357,110]] },
  { full: [[140,480],[200,330],[260,180],[340,90],[420,70],[470,100],[430,200],[400,480]] },
  { half: [[120,480],[120,430],[150,430],[150,390],[180,390],[180,350],[210,350],[210,310],[240,310],[240,270],[357,270]] },
  { half: [[110,480],[110,250],[130,240],[150,200],[180,190],[200,160],[240,150],[280,120],[357,100]] },
  { full: [[100,480],[100,300],[125,300],[125,180],[135,120],[145,180],[145,300],[220,300],[220,200],[260,140],[300,200],[300,300],[450,300],[450,480]] },
  { half: [[60,480],[60,330],[130,330],[130,300],[200,300],[200,270],[357,270]] }
];
var ARCH = [[40,480],[40,260],[110,200],[210,160],[320,125],[430,100],[500,128],[500,172],[420,190],[340,215],[290,260],[255,330],[250,480]];
VARIANTS.push({ full: ARCH }, { full: ARCH.map(function (p) { return [2 * CX - p[0], p[1]]; }).reverse() });
var ARCHES = VARIANTS.slice(-2);
function build(v) {
  if (v.full) return v.full;
  var l = v.half, r = [];
  for (var i = l.length - 1; i >= 0; i--) {
    if (l[i][0] === CX && i === l.length - 1) continue;
    r.push([2 * CX - l[i][0], l[i][1]]);
  }
  return l.concat(r);
}
function inside(pts, x, y) {
  var c = false;
  for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
function edgeDist(pts, x, y) {
  var m = 1e9;
  for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    var a = pts[j], b = pts[i], dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
    var t = l2 ? Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / l2)) : 0;
    m = Math.min(m, Math.hypot(x - a[0] - t * dx, y - a[1] - t * dy));
  }
  return m;
}
var MARGIN = 17.7;

/* ---------- towers ---------- */
var towers = [], chasms = [], props = [], nextTX = 750, prevMax = 400;
function inCh(x) { for (var i = 0; i < chasms.length; i++) if (x > chasms[i].x0 && x < chasms[i].x1) return true; return false; }
function railY(r, x) {
  var p = r.pts;
  if (x < p[0].x || x > p[2].x) return NaN;
  var a = x < p[1].x ? p[0] : p[1], b = x < p[1].x ? p[1] : p[2];
  return a.y + (b.y - a.y) * (x - a.x) / (b.x - a.x);
}
function addProp(kind, x0, x1) {
  var mx = (x0 + x1) / 2;
  if (kind === 'balloon') {
    if (!clearOf(mx, 462, 58, 66) || balloonHitsLine(mx, 462, 58, 66)) return;
    props.push({ t: 'balloon', x: mx, cy: 462, rx: 58, ry: 66, x1: x1 + 80, sq: 0 });
    return;
  }
  var pts = [{ x: x0 - 70, y: gy(x0 - 70) - 4 }, { x: mx, y: 300 }, { x: x1 + 70, y: gy(x1 + 70) - 4 }], flags = [];
  for (var s = 0; s < 2; s++) {
    var a = pts[s], b = pts[s + 1], n = Math.floor((b.x - a.x) / 26);
    for (var i = 1; i < n; i++) {
      var u = i / n;
      flags.push({ x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, fall: false, vx: 0, vy: 0, rot: 0, a: 1, c: flags.length % 2 });
    }
  }
  props.push({ t: 'rail', pts: pts, flags: flags, x1: pts[2].x + 20 });
}
function drawBalloon(mx, cy, rx, ry) {
  var bt = cy + ry + 40;
  ctx.strokeStyle = '#4a2a2c'; ctx.lineWidth = 1.4; ctx.beginPath();
  ctx.moveTo(mx - rx * 0.55, cy + ry * 0.83); ctx.lineTo(mx - 13, bt);
  ctx.moveTo(mx + rx * 0.55, cy + ry * 0.83); ctx.lineTo(mx + 13, bt);
  ctx.moveTo(mx - rx * 0.2, cy + ry * 0.98); ctx.lineTo(mx - 6, bt);
  ctx.moveTo(mx + rx * 0.2, cy + ry * 0.98); ctx.lineTo(mx + 6, bt);
  ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.ellipse(mx, cy, rx, ry, 0, 0, 6.283); ctx.clip();
  for (var i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? '#8c5a4c' : '#b57d69'; ctx.fillRect(mx - rx, cy - ry + i * ry / 4, rx * 2, ry / 4 + 1); }
  var sg = ctx.createLinearGradient(mx - rx, 0, mx + rx, 0);
  sg.addColorStop(0, 'rgba(255,230,210,.18)'); sg.addColorStop(1, 'rgba(42,15,16,.38)');
  ctx.fillStyle = sg; ctx.fillRect(mx - rx, cy - ry, rx * 2, ry * 2);
  ctx.restore();
  ctx.fillStyle = '#4a2a2c'; ctx.fillRect(mx - 13, bt, 26, 17);
  ctx.fillStyle = 'rgba(255,207,138,.9)'; ctx.beginPath(); ctx.arc(mx, bt - 6, 5, 0, 6.283); ctx.fill();
}

function genTower() {
  if (chasmMode && nextTX > CH_START - 400) { nextTX += 600; return; }
  var sc = 0.85 + Math.random() * 0.3;
  var hasCh = Math.random() < 0.3825, big = hasCh && Math.random() < 0.1;
  var kind = big ? ['arch', 'rail', 'balloon'][Math.floor(Math.random() * 3)] : '';
  if (kind === 'rail' || kind === 'balloon') nextTX += 420;
  var v = kind === 'arch' ? { full: ARCH } : (Math.random() < 0.22 ? ARCHES[Math.floor(Math.random() * 2)] : VARIANTS[Math.floor(Math.random() * VARIANTS.length)]);
  var raw = build(v), cx = nextTX + 260 * sc;
  var pts = raw.map(function (p) { return [cx + (p[0] - CX) * sc, 540 + (p[1] - 480) * sc]; });
  var minX = 1e9, maxX = -1e9, minY = 1e9;
  pts.forEach(function (p) { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); });
  for (var hc = 0; hc < chasms.length; hc++) {
    var cz = chasms[hc];
    if (minX < cz.x1 + 60 && maxX > cz.x0 - 60) { nextTX += (cz.x1 + 80) - minX; return genTower(); }
  }
  var dots = [];
  for (var y = minY; y < 500; y += 11)
    for (var x = minX; x < maxX; x += 11)
      if (inside(pts, x, y) && edgeDist(pts, x, y) >= MARGIN) dots.push(x, y);
  towers.push({ pts: pts, minX: minX, maxX: maxX, dots: dots });
  function wx(r) { return cx + (r - CX) * sc; }
  if (kind === 'arch') {
    chasms.push({ x0: wx(262), x1: wx(500) + 70 });
  } else if (kind) {
    var bw = 320 + Math.random() * 60, ba = prevMax + 90, bb = minX - 90 - bw;
    var b0 = ba + Math.random() * Math.max(0, bb - ba);
    chasms.push({ x0: b0, x1: b0 + bw });
    addProp(kind, b0, b0 + bw);
  } else if (hasCh) {
    var cw = 90 + Math.random() * 60, ca = prevMax + 70, cb = minX - 70 - cw;
    if (cb > ca) { var c0 = ca + Math.random() * (cb - ca); chasms.push({ x0: c0, x1: c0 + cw }); }
  }
  prevMax = maxX;
  nextTX = maxX + (380 + Math.random() * 520) * 0.83;
}
function glideZone(x, y) {
  for (var i = 0; i < towers.length; i++) {
    var t = towers[i];
    if (x > t.minX && x < t.maxX && inside(t.pts, x, y) && edgeDist(t.pts, x, y) >= MARGIN) return t;
  }
  return null;
}

/* ---------- parallax skyline ---------- */
var T = 1600;
function mkLayer(n, hmin, hr) {
  var a = [];
  for (var i = 0; i < n; i++) {
    var x = i * (T / n) + Math.random() * 30, w = 70 + Math.random() * 90, h = hmin + Math.random() * hr, s = (Math.random() - 0.5) * 70;
    a.push([[x, 900], [x, 520 - h], [x + w * 0.45, 520 - h - 20 - Math.random() * 40], [x + w, 520 - h + s], [x + w, 900]]);
  }
  return a;
}
var layers = [{ p: mkLayer(9, 70, 150), f: 0.12, c: 'rgba(191,143,145,.55)' }, { p: mkLayer(8, 40, 110), f: 0.28, c: 'rgba(207,163,162,.7)' }];

/* ---------- state ---------- */
var P = { x: 200, y: gy(200), vy: 0, air: false, rot: 0 };
var spd = 250, hold = false, jumpBuf = 0, camX = 0, camY = 0;
var glideTotal = 0, streak = 0, bestStreak = 0, parts = [], gliding = false, hintOff = false;
var dead = false, deadT = 0, bestDist = 0;
var rail = null, railCool = 0;
var runs = 0, lifeGlide = 0, bestScore = 0, lifeMoney = 0;
var wallet = 0, owned = {}, equipped = '', frBonus = 0, dashBoost = 0, flightSilk = 100, silkCD = 0, silkDash = 0, secondUsed = false, shopOpen = false, paused = false, flyingNow = false, perks = {}, nextRockX = 1200, nextLineX = 800, chasmMode = false, nextChasm = false, CH_START = 1400;
var holdAirT = 0, afterGlide = false, flipping = false, flipArmed = false, flipStart = 0, flipRot = 0, pressAir = false, combo = 0, score = 0, trick = null;

window.dgOnLoaded = function (d) {
  bestDist = Math.max(bestDist, d.bestDist || 0);
  bestStreak = Math.max(bestStreak, d.bestStreak || 0);
  lifeGlide = d.lifeGlide || 0;
  runs = d.runs || 0;
  bestScore = Math.max(bestScore, d.bestScore || 0);
  lifeMoney = d.lifeMoney || 0;
  wallet = d.wallet || 0; owned = d.owned || {}; equipped = d.equipped || ''; perks = d.perks || {};
  renderShop();
};
function cloudSave() {
  if (!window.dgSave) return;
  window.dgSave({ bestDist: bestDist, bestStreak: bestStreak, lifeGlide: Math.round(lifeGlide), runs: runs, bestScore: bestScore, lifeMoney: lifeMoney, wallet: wallet, owned: owned, equipped: equipped, perks: perks });
}
addEventListener('pagehide', cloudSave);

function press() {
  if (dead) { if (deadT > 0.7) restart(); return; }
  if (P.air && !rail) pressAir = true;
  hold = true; jumpBuf = 0.14;
  if (!hintOff) { hintOff = true; setTimeout(function () { hint.style.opacity = 0; }, 3500); }
}
function release() { hold = false; }
cv.addEventListener('pointerdown', function (e) { if (e.button > 0) return; press(); });
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('blur', release);
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
addEventListener('keydown', function (e) { if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) { e.preventDefault(); press(); } });
addEventListener('keyup', function (e) { if (e.code === 'Space' || e.code === 'ArrowUp') release(); });

function burst(x, y, n, power) {
  for (var i = 0; i < n; i++) parts.push({ x: x, y: y, vx: (Math.random() - 0.3) * power, vy: -Math.random() * power, life: 0.5 + Math.random() * 0.4 });
}

function die(why) {
  if (reviveNow()) return;
  document.body.classList.add('dead');

function spawnRock() {

}
function spawnRuin() {

    var cx = ((i * 311 - camX * 0.12) % span + span) % span - 120, cy = 90 + (i * 53) % 90;

function poly(pts) { ctx.beginPath(); pts.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.closePath(); }

function draw() {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  var dusk = Math.min(1, Math.max(0, (P.x - 200) / 7000));
  var sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, mixC('#e9b9ad', '#6d4f7e', dusk)); sky.addColorStop(0.6, mixC('#f2cfc0', '#b98a8e', dusk)); sky.addColorStop(1, mixC('#f6dccd', '#e3a9a0', dusk));

  ctx.fillStyle = mixC('#fff4e0', '#ffd9b8', dusk); ctx.beginPath(); ctx.arc(sx, 235, 36, 0, 7); ctx.fill();

  towers.forEach(function (t) {

    ctx.lineWidth = 36; ctx.strokeStyle = '#f3cdb9'; ctx.stroke();
    ctx.lineWidth = 31; ctx.strokeStyle = '#dca58f'; ctx.stroke();
    ctx.fillStyle = '#8c5a4c'; ctx.fill();

    ctx.fillStyle = sh; ctx.fill();
    ctx.strokeStyle = '#a97463'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();

    }

    ctx.fillStyle = 'rgba(234,185,162,.85)'; ctx.beginPath();

      ctx.moveTo(dx + 1.7, dy); ctx.arc(dx, dy, 1.7, 0, 6.3);

      for (var n = 0; n < near.length; n += 2) { ctx.moveTo(near[n] + 2.6, near[n + 1]); ctx.arc(near[n], near[n + 1], 2.6, 0, 6.3); }
      ctx.fill();

  // dune
  var x0 = Math.floor(camX / 14) * 14 - 28, x1 = camX + W + 28, bot = camY + H + 300;
  ctx.beginPath(); ctx.moveTo(x0, bot);
  for (var x = x0; x <= x1; x += 14) ctx.lineTo(x, gy(x));
  ctx.lineTo(x1, bot); ctx.closePath();
  var dg = ctx.createLinearGradient(0, 440, 0, 620);
  dg.addColorStop(0, '#f6dccb'); dg.addColorStop(0.45, '#efcdba'); dg.addColorStop(1, '#d9ab97');
  ctx.fillStyle = dg; ctx.fill();
  ctx.beginPath();
  for (x = x0; x <= x1; x += 14) x === x0 ? ctx.moveTo(x, gy(x)) : ctx.lineTo(x, gy(x));
  ctx.strokeStyle = 'rgba(249,228,214,.9)'; ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath();

  for (x = x1; x >= x0; x -= 14) ctx.lineTo(x, gy(x) + 14 + Math.sin(x * 0.02) * 2);
  ctx.closePath(); ctx.fillStyle = 'rgba(255,244,230,.45)'; ctx.fill();
  var tile0 = Math.floor(x0 / 1200), tile1 = Math.floor(x1 / 1200);
  ctx.fillStyle = 'rgba(140,80,70,.22)'; ctx.beginPath();
  for (var tl = tile0; tl <= tile1; tl++) for (var gj = 0; gj < GRAIN.length; gj++) {
    var gxw = tl * 1200 + GRAIN[gj][0], gyw = gy(gxw) + 20 + GRAIN[gj][1] * 120;
    ctx.moveTo(gxw + 1.1, gyw); ctx.arc(gxw, gyw, 1.1, 0, 6.3);
  }
  ctx.fill();
  ctx.beginPath(); ctx.moveTo(x0, bot);
  for (x = x0; x <= x1; x += 14) ctx.lineTo(x, gy(x) + 48 + Math.sin(x * 0.006) * 10);
  ctx.lineTo(x1, bot); ctx.closePath(); ctx.fillStyle = 'rgba(230,187,167,.7)'; ctx.fill();

  // chasms
  chasms.forEach(function (c) {
    if (c.x1 < camX - 40 || c.x0 > camX + W + 40) return;
    ctx.beginPath(); ctx.moveTo(c.x0, gy(c.x0));
    for (var xx = c.x0; xx <= c.x1; xx += 10) ctx.lineTo(xx, gy(xx));
    ctx.lineTo(c.x1, gy(c.x1)); ctx.lineTo(c.x1 - 26, bot); ctx.lineTo(c.x0 + 26, bot); ctx.closePath();
    ctx.fillStyle = '#f6dccd'; ctx.fill();
    ctx.strokeStyle = 'rgba(249,228,214,.9)'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(c.x0, gy(c.x0));
    for (var sx = c.x0; sx <= c.x1; sx += 10) ctx.lineTo(sx, gy(sx));
    ctx.lineTo(c.x1, gy(c.x1));
    ctx.moveTo(c.x0, gy(c.x0)); ctx.lineTo(c.x0 + 26, bot);
    ctx.moveTo(c.x1, gy(c.x1)); ctx.lineTo(c.x1 - 26, bot);
    ctx.stroke();
  });

  props.forEach(function (p) {
    if (p.t === 'balloon') {
      if (p.x + 140 < camX || p.x - 140 > camX + W) return;
      drawBalloon(p.x, p.cy, p.rx, p.ry * (1 - p.sq * 0.14));
    } else if (p.t === 'line') {

      var rb = gy(p.x) + 6;
      ctx.fillStyle = '#7a5a5a'; ctx.beginPath(); ctx.moveTo(p.x - 18, rb); ctx.lineTo(p.x - 12, p.top + 4); ctx.lineTo(p.x - 2, p.top); ctx.lineTo(p.x + 10, p.top + 6); ctx.lineTo(p.x + 18, rb); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#a48080'; ctx.beginPath(); ctx.moveTo(p.x - 6, p.top + 2); ctx.lineTo(p.x - 2, p.top); ctx.lineTo(p.x + 10, p.top + 6); ctx.lineTo(p.x + 2, p.top + 9); ctx.closePath(); ctx.fill();

  else { var ph = P.air ? 0.9 : Math.sin(P.x * 0.1); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(7 * ph, 1); ctx.moveTo(0, -4); ctx.lineTo(-7 * ph, 1); ctx.stroke(); }
  ctx.fillStyle = '#f4efe8'; ctx.fillRect(-2.5, -20, 5, 18);
  ctx.fillStyle = '#2a2630'; ctx.beginPath(); ctx.arc(0, -25, 4, 0, 7); ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-3, -22);
  var wob = Math.sin(performance.now() / 90) * 2;
  ctx.quadraticCurveTo(-14, -22 + wob, -(18 + spd / 40), -19 - wob); ctx.stroke();

    ctx.fillStyle = 'rgba(255,244,230,.92)'; ctx.strokeStyle = '#6b4240'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-2, -18); ctx.quadraticCurveTo(-18, -36 - fl, -28, -26 - fl); ctx.quadraticCurveTo(-20, -18, -2, -14); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  if (equipped === 'friction' && (frBonus > 0 || dashBoost > 0)) {

    ctx.beginPath(); ctx.moveTo(-16, 3); ctx.lineTo(16, 1); ctx.stroke();
  }
  if (equipped === 'sand' && P.air && hold && !gliding) {
    ctx.fillStyle = 'rgba(230,190,160,.7)';
    for (var sd = 0; sd < 4; sd++) { ctx.beginPath(); ctx.arc(-14 + sd * 8, 5 + (performance.now() / 120 + sd) % 3, 1.8, 0, 6.3); ctx.fill(); }
  }
  if (equipped === 'silk') {
    ctx.strokeStyle = silkCD > 0 ? 'rgba(255,255,255,.15)' : 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -14, 26, 0, 6.3); ctx.stroke();

  if (silkDash > 0) {
    ctx.strokeStyle = 'rgba(255,248,216,.9)'; ctx.lineWidth = 3; ctx.beginPath();
    for (var sk = 0; sk < 4; sk++) { ctx.moveTo(-70 - sk * 6, -22 + sk * 5); ctx.lineTo(-20, -22 + sk * 5); }

    ctx.strokeStyle = 'rgba(255,240,226,.45)'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath();

var last = performance.now();
function loop(now) {
  var dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (!shopOpen && !paused) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
